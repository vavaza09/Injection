name: Build — Injection

on:
  workflow_dispatch:
    inputs:
      development:
        description: 'WebGL Development build (diagnostics overlay + readable function names for Chrome DevTools profiling)'
        type: boolean
        default: false
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - WebGL
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        if: matrix.targetPlatform == 'WebGL'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: BlueSteam
          # WebGL uses CiBuild so Code Optimization is forced to Runtime Speed (LTO) — it is an
          # EditorUserBuildSettings value stored in Library/, which CI never gets from the repo.
          buildMethod: ${{ matrix.targetPlatform == 'WebGL' && 'CiBuild.BuildWebGL' || '' }}
          customParameters: ${{ matrix.targetPlatform == 'WebGL' && inputs.development && '-devBuild' || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

      - name: Zip build for release
        if: startsWith(github.ref, 'refs/tags/')
        run: cd build && zip -r ../${{ matrix.targetPlatform }}.zip ${{ matrix.targetPlatform }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.targetPlatform }}.zip
