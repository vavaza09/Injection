name: QA Tests — Injection

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unity EditMode Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run Unity EditMode Tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: editmode
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults

      - name: Check test pass rate
        if: always()
        run: |
          if [ -f TestResults/editmode-results.xml ]; then
            FAILURES=$(grep -oP 'failures="\K[^"]*' TestResults/editmode-results.xml || echo "0")
            ERRORS=$(grep -oP 'errors="\K[^"]*' TestResults/editmode-results.xml || echo "0")
            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo "Tests failed: $FAILURES failures, $ERRORS errors"
              exit 1
            fi
            echo "All tests passed"
          fi
